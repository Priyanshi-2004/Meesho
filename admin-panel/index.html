<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Meesho Optimizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard">
        <header class="top-header">
            <div class="logo">Meesho Optimizer Admin</div>
            <div class="user-info">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                Admin Panel
            </div>
        </header>

        <main class="main-content">
            <!-- Add User Card -->
            <section class="card add-user-card">
                <h2>Add New User</h2>
                <div class="form-group-row">
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="user@example.com">
                    </div>
                    <div class="input-group">
                        <label>Plan</label>
                        <select id="plan">
                            <option value="paid">Paid</option>
                            <option value="free">Free</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Expiry Date</label>
                        <input type="date" id="expiry">
                    </div>
                    <button id="addUserBtn" class="primary-btn">Add User</button>
                </div>
                <p id="statusMessage" class="status-message"></p>
            </section>

            <!-- Users Table -->
            <section class="card users-list-card">
                <div class="card-header">
                    <h2>Manage Users</h2>
                    <div class="actions">
                        <input type="text" id="searchInput" placeholder="Search by email..." class="search-input">
                        <select id="filterStatus" class="filter-select">
                            <option value="all">All</option>
                            <option value="active">Active</option>
                            <option value="blocked">Blocked</option>
                        </select>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="users-table">
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th>Plan</th>
                                <th>Status</th>
                                <th>Creation Date</th>
                                <th>Expiry Date</th>
                                <th>Device ID</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Rows rendered via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
