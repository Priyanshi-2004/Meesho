<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Meesho AI Optimizer</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div id="login" class="login-container">
            <div class="login-card">
                <div class="logo-area">
                    <div class="logo-icon"></div>
                    <h2>Meesho Optimizer</h2>
                    <p>AI SHIPPING CALCULATOR</p>
                </div>

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="userName"
                        placeholder="Enter your full name" />
                    <label>Email Address</label>
                    <input type="email" id="email"
                        placeholder="Enter your email" />
                    <p id="authMessage"
                        style="margin-top: 10px; font-size: 14px; font-weight: 500; display: none;"></p>
                    <button id="verifyAccessBtn" class="primary-btn"
                        style="margin-top: 15px;">Verify Access</button>
                    <button id="buyAccessBtn" class="secondary-btn"
                        style="margin-top: 10px; display: none;">Purchase
                        Access</button>
                    <button id="contactSupportBtn" class="secondary-btn"
                        style="margin-top: 10px; display: none;">Contact
                        Support</button>
                </div>
            </div>
        </div>

        <div id="app" style="display:none;" class="dashboard-layout">
            <!-- Main Content -->
            <main class="main-content" style="border-radius: 0;">
                <div class="dashboard-content" style="padding-top: 20px;">
                    <!-- Profile Header -->
                    <header class="user-profile-header"
                        style="max-width: 600px; margin: 0 auto 20px auto;">
                        <div class="user-info">
                            <div class="user-avatar-circle"
                                id="userAvatar">H</div>
                            <div class="user-name-text"
                                id="userNameDisplay">HARSH MOTWANI</div>
                        </div>
                        <button type="button" class="logout-btn"
                            id="signOutBtn">Logout</button>
                    </header>
                    <div class="view-section active"
                        style="max-width: 600px; margin: 0 auto;">
                        <div class="section-header" style="text-align: center;">
                            <h2>Optimize Shipping Price</h2>
                            <p>Upload a product image, select its category, and
                                let AI calculate the lowest possible shipping
                                cost.</p>
                        </div>

                        <!-- Upload Area -->
                        <div class="dropzone" id="uploadZone">
                            <svg viewBox="0 0 24 24" width="48" height="48"
                                stroke="#07f49e" stroke-width="2" fill="none"
                                style="margin-bottom: 10px;">
                                <path
                                    d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <h3>Drag & Drop Product Image Here</h3>
                            <p>Supports .JPG, .PNG (Max 5MB)</p>
                            <input type="file" id="imageInput" accept="image/*"
                                style="display: none;" />
                            <button id="browseFilesBtn"
                                class="secondary-btn">Browse Files</button>
                        </div>

                        <div id="loaded-manifest-container"
                            style="display: none; margin-top: 15px; text-align: center; color: #e2e8f0; background: rgba(7, 244, 158, 0.1); padding: 12px; border-radius: 8px; border: 1px solid rgba(7, 244, 158, 0.3);">
                            <p id="loaded-manifest-msg"
                                style="margin: 0; font-size: 14px;"><strong>Ready
                                    to Process:</strong> image loaded.</p>
                        </div>

                        <!-- Settings & Action -->
                        <div class="generate-card" style="margin-top: 30px;">
                            <div class="form-group"
                                style="text-align: left; margin-bottom: 0;">
                                <label
                                    style="font-size: 14px; color: #cbd5e1; margin-bottom: 8px; display: block;">Product
                                    Category</label>
                                <select id="popup-category"
                                    class="styled-select" style="width: 100%;">
                                    <option value="Clothing">Clothing &
                                        Apparel</option>
                                    <option
                                        value="Electronics">Electronics</option>
                                    <option value="Home">Home & Kitchen</option>
                                    <option value="Beauty">Beauty &
                                        Health</option>
                                    <option value="Jewellery">Jewellery &
                                        Accessories</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>

                            <button id="runGeneratorBtn"
                                class="primary-btn glow-btn"
                                style="margin-top: 20px; width: 100%; justify-content: center;">
                                <svg viewBox="0 0 24 24" width="18" height="18"
                                    stroke="currentColor" stroke-width="2"
                                    fill="none">
                                    <polygon
                                        points="5 3 19 12 5 21 5 3"></polygon>
                                </svg>
                                Optimize Shipping Price
                            </button>
                        </div>

                        <!-- Results Area -->
                        <div id="results" class="results-area"
                            style="margin-top: 30px;"></div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast-notification"></div>

        <script src="popup.js"></script>
    </body>

</html>
